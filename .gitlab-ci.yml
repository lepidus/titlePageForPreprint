variables:
  PLUGIN_NAME: 'titlePageForPreprint'

include:
  - project: 'documentacao-e-tarefas/modelosparaintegracaocontinua'
    ref: stable-3_5_0
    file:
      - 'templates/groups/pkp_plugin.yml'
      - 'templates/groups/ops/unit_tests.yml'
      - 'templates/groups/ops/cypress_tests.yml'

.unit_test_template:
  before_script:
    - apt update && apt install poppler-utils imagemagick php8.4-imagick xmlstarlet -yqq
    - composer install
    - xmlstarlet edit --inplace -s "/policymap" -t elem -n "newpolicy" -i "//newpolicy" -t attr -n "domain" -v "coder" -i "//newpolicy" -t attr -n "rights" -v "read|write" -i "//newpolicy" -t attr -n "pattern" -v "PDF" -r "//newpolicy" -v "policy" /etc/ImageMagick-7/policy.xml
    - wget https://github.com/coherentgraphics/cpdf-binaries/blob/master/Linux-Intel-64bit/cpdf?raw=true -O /usr/local/bin/cpdf
    - chmod +x /usr/local/bin/cpdf

.integration_tests_template:
  before_script:
    - apt update && apt install poppler-utils -yqq
    - composer install
    - wget https://github.com/coherentgraphics/cpdf-binaries/blob/master/Linux-Intel-64bit/cpdf?raw=true -O /usr/local/bin/cpdf
    - chmod +x /usr/local/bin/cpdf